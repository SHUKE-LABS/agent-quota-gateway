<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Quota Gateway — Pool Management</title>
<style>
  /* Self-contained stylesheet — no external fonts, no CDN. */
  :root {
    --bg: #f7f7f8;
    --panel: #ffffff;
    --border: #d6d8db;
    --text: #1f2328;
    --muted: #57606a;
    --accent: #0969da;
    --accent-text: #ffffff;
    --danger: #cf222e;
    --ok: #1a7f37;
    --warn: #9a6700;
    --shadow: 0 1px 2px rgba(31, 35, 40, 0.04), 0 3px 6px rgba(31, 35, 40, 0.06);
    --scroll-shadow: rgba(31, 35, 40, 0.22);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #2f81f7;
      --accent-text: #ffffff;
      --danger: #f85149;
      --ok: #3fb950;
      --warn: #d29922;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 3px 6px rgba(0, 0, 0, 0.4);
      --scroll-shadow: rgba(0, 0, 0, 0.55);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
  }
  a { color: var(--accent); text-decoration: none; }
  a:focus, button:focus, .toggle:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

  header.top {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  header.top h1 { font-size: 18px; margin: 0; }
  header.top .meta { color: var(--muted); font-family: var(--mono); font-size: 12px; }

  main { padding: 16px 24px 32px; }
  /* On phones the members table needs every pixel; halving the side gutters
     frees ~24px of horizontal room inside the card. Hardcoded 12px rather
     than env(safe-area-inset-*) (which is 0 without viewport-fit=cover) —
     keep it dependency-free. Desktop-only cosmetic: dropping max-width lets
     main fill a wide monitor; on mobile main already fills the viewport, so
     neither change regresses narrow widths (issue #171). */
  @media (max-width: 540px) {
    main { padding: 16px 12px 32px; }
  }

  #banner {
    display: none;
    padding: 8px 12px;
    margin-bottom: 12px;
    border-radius: 6px;
    background: rgba(207, 34, 46, 0.1);
    color: var(--danger);
    border: 1px solid var(--danger);
  }
  #banner.show { display: block; }

  /* Persistent unsaved-config warning (issue #218). Kept separate from
     #banner so transient showBanner messages neither overwrite it nor trigger
     its auto-hide; this one stays visible until a later config load clears it.
     Amber, not the danger red of #banner, so a lagging on-disk write reads as
     a warning rather than a hard failure. */
  #unsaved {
    display: none;
    padding: 8px 12px;
    margin-bottom: 12px;
    border-radius: 6px;
    background: rgba(154, 103, 0, 0.12);
    color: #9a6700;
    border: 1px solid #9a6700;
  }
  #unsaved.show { display: block; }

  /* Persistent env-only warning (issue #246). Distinct copy, distinct
     hue (info-blue) from both #banner (transient error, red) and #unsaved
     (lagging flush, amber) so an operator can tell at a glance which
     failure mode the banner names. */
  #envonly {
    display: none;
    padding: 8px 12px;
    margin-bottom: 12px;
    border-radius: 6px;
    background: rgba(9, 105, 218, 0.10);
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  #envonly.show { display: block; }

  .pool {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .pool header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .pool h2 { margin: 0; font-size: 15px; font-family: var(--mono); }
  .pool .badge { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .pool .updated { margin-left: auto; font-size: 12px; color: var(--muted); font-family: var(--mono); }

  .col {
    padding: 12px 16px;
    /* Allow this block to be narrower than its (wide) content so the members
       table's .members-scroll wrapper can actually scroll instead of forcing
       the block past the card edge (clipped by .pool overflow:hidden). */
    min-width: 0;
  }
  .col h3 {
    margin: 0 0 8px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  /* Priority rank + reorder controls, folded into the members table's leading
     Nick cell (issue #222) so a member's rank and its quota/status read on one
     row. The flex row keeps the rank number, nick, and ↑/↓ buttons on a single
     line; nowrap keeps the buttons from dropping under the nick on a tight
     column. */
  td.nick .nick-prio {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: nowrap;
  }
  td.nick .rank {
    color: var(--muted);
    min-width: 1.2em;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  td.nick .nick-name { flex: 1; }
  td.nick .prio-btn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 4px;
    padding: 2px 8px;
    font-family: var(--mono);
    cursor: pointer;
  }
  td.nick .prio-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  td.nick .prio-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .balanced-note { color: var(--muted); font-style: italic; }

  /* The members table is intrinsically wide (7 columns, with nowrap reset
     cells). It fits at desktop widths, but once the cards stack and the
     viewport is narrower than the table's min-content width (~727px, i.e.
     small tablets and phones) the cell can no longer hold it. This wrapper
     lets the table scroll horizontally inside its card instead of clipping
     the rightmost (actions) column. */
  /* On phones the members table overflows .members-scroll (a 7-column table
     can never fit a 375px viewport). It scrolls there, but touch viewports
     show no scrollbar affordance — Chromium suppresses custom scrollbars
     under overlay/touch mode — so the clipped columns read as missing rather
     than scrollable. An edge fade is the chosen indicator (owner rejected a
     visible scrollbar as ugly, and a JS scroll-aware overlay too).

     This uses the pure-CSS background-attachment:local scroll-shadow technique
     (Lea Verou / Roman Komarov). Four background layers on the scroll box:
     two --panel-colored *cover* gradients painted with background-attachment:
     local (so they scroll with the content) sit on top of two *shadow*
     gradients with background-attachment: scroll (pinned to the box edges).
     At a scroll extreme the content edge lines up with the box edge, so the
     cover masks the shadow beneath and that fade disappears — the fade shows
     only when there is actually more content in that direction. This makes it
     self-hiding at both edges, so it needs no viewport gate: at desktop the
     table fits, nothing scrolls, both covers mask their shadows → invisible.

     Chosen over animation-timeline:scroll() because iOS Safari lacks that
     feature (a large share of mobile users would get no affordance at all),
     while background-attachment: local is long-supported there. Covers are
     --panel so they blend in both themes; the shadow uses the theme-aware
     --scroll-shadow. Backgrounds sit behind content, so the fade never blocks
     the touch scroll. */
  .members-scroll {
    overflow-x: auto;
    background:
      linear-gradient(to right, var(--panel), transparent) left center,
      linear-gradient(to left, var(--panel), transparent) right center,
      linear-gradient(to right, var(--scroll-shadow), transparent) left center,
      linear-gradient(to left, var(--scroll-shadow), transparent) right center;
    background-repeat: no-repeat;
    background-size: 28px 100%, 28px 100%, 20px 100%, 20px 100%;
    background-attachment: local, local, scroll, scroll;
  }
  /* table-layout: fixed pins column widths from the th:nth-child rules below
     instead of deriving them per-table from cell content, so the 7 columns
     land at identical widths in every pool section (they don't align under
     the default auto layout — issue #227). min-width keeps the table wider
     than a phone viewport (~760px, roughly the old min-content) so it still
     overflows into .members-scroll and scrolls horizontally on narrow
     screens; without it a fixed + width:100% table collapses to the
     container and would never scroll (issues #166/#171). */
  table.members {
    width: 100%;
    min-width: 760px;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 13px;
  }
  /* Column widths (must sum to 100%): Nick, Status, 5H, 5H reset, 7/30D,
     7/30D reset, actions. Reset columns take a fixed nowrap-friendly share;
     the quota-bar columns (.quota-track flexes down to min-width:36px) take
     the middle; actions is widest for the toggle + Move + Remove controls. */
  table.members th:nth-child(1) { width: 18%; }
  table.members th:nth-child(2) { width: 11%; }
  table.members th:nth-child(3) { width: 13%; }
  table.members th:nth-child(4) { width: 12%; }
  table.members th:nth-child(5) { width: 13%; }
  table.members th:nth-child(6) { width: 12%; }
  table.members th:nth-child(7) { width: 21%; }
  table.members th, table.members td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
  }
  table.members th { font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  table.members tr:last-child td { border-bottom: none; }
  table.members td.nick { font-family: var(--mono); }
  table.members td.quota { min-width: 72px; }
  table.members td.reset { color: var(--muted); white-space: nowrap; }

  /* Compact quota bar: a track with a fill, plus a NN% label. Falls back
     to a plain "-" text node when the window has no utilization yet.
     Reset times render in their own adjacent columns. */
  .quota-dash { color: var(--muted); }
  .quota-bar {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .quota-track {
    position: relative;
    flex: 1 1 auto;
    min-width: 36px;
    height: 8px;
    border-radius: 999px;
    background: var(--border);
    overflow: hidden;
  }
  .quota-fill {
    position: absolute;
    inset: 0 auto 0 0;
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
  }
  .quota-pct {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .status {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    text-transform: lowercase;
    border: 1px solid var(--border);
    color: var(--muted);
    background: var(--bg);
  }
  .status[data-status="active"] { color: var(--ok); border-color: var(--ok); }
  .status[data-status="exhausted"] { color: var(--danger); border-color: var(--danger); }
  .status[data-status="disabled"] { color: var(--muted); }
  .status[data-status="idle"] { color: var(--accent); border-color: var(--accent); }

  /* Per-member enable/disable control. Encodes the member's *current* state,
     not the action the click will perform. The click still routes through
     toggleMember() at index.html:866 and the /enable / /disable endpoints. */
  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: 0;
    padding: 0;
    cursor: pointer;
    font: inherit;
    color: var(--text);
  }
  .toggle[disabled] { color: var(--muted); }
  .toggle:disabled { opacity: 0.5; cursor: not-allowed; }
  .toggle-track {
    position: relative;
    width: 30px;
    height: 16px;
    border-radius: 999px;
    background: var(--muted);
    transition: background 120ms ease;
    flex: 0 0 auto;
  }
  .toggle[data-state="enabled"] .toggle-track { background: var(--accent); }
  .toggle-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    transition: transform 120ms ease;
  }
  .toggle[data-state="enabled"] .toggle-thumb { transform: translateX(14px); }
  .toggle-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    min-width: 22px;
  }
  .toggle[data-state="enabled"] .toggle-label { color: var(--accent); }
  .toggle:hover:not(:disabled) .toggle-thumb { box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.25); }

  .empty {
    color: var(--muted);
    font-style: italic;
    padding: 16px;
    text-align: center;
  }

  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  button.remove {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--danger);
    border-radius: 4px;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  button.remove:hover { border-color: var(--danger); background: rgba(207, 34, 46, 0.08); }
  button.move {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 4px;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  button.move:hover { border-color: var(--accent); color: var(--accent); }
  /* Per-member "Clear park" escape hatch (issue #147). Hidden by default; shown
     by applyLiveStatus() only when the member reports parked:true. */
  button.clear-park {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--accent);
    border-radius: 4px;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  button.clear-park:hover { border-color: var(--accent); background: rgba(0, 0, 0, 0.04); }
  /* "Delete pool" — header control shown only for an empty pool (issue #233).
     margin-left:auto floats it to the header's right edge; for an empty pool the
     .updated span carries no text and collapses, so this owns the free space. */
  button.delete-pool {
    margin-left: auto;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--danger);
    border-radius: 4px;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  button.delete-pool:hover { border-color: var(--danger); background: rgba(207, 34, 46, 0.08); }
  /* "Rename pool" — header control shown for every pool (issue #238). The
     selector below targets the adjacent delete-pool button (rendered only
     for empty pools) so the two stay visually separated when both apply. */
  button.rename-pool {
    margin-left: auto;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--accent);
    border-radius: 4px;
    padding: 3px 10px;
    cursor: pointer;
    font-size: 12px;
  }
  button.rename-pool + button.delete-pool { margin-left: 8px; }
  button.rename-pool:hover { border-color: var(--accent); background: rgba(0, 0, 0, 0.04); }

  .addsub-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    padding: 12px 16px;
  }
  .addsub-card h2 { margin: 0 0 10px; font-size: 15px; font-family: var(--mono); }
  .addsub-hint { margin: 0 0 10px; font-size: 12px; color: var(--muted); }

  form.add-member {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
  }
  form.add-member input,
  form.add-member select {
    flex: 1 1 120px;
    min-width: 0;
    padding: 5px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
  }
  form.add-member input:focus,
  form.add-member select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  form.add-member button {
    flex: 0 0 auto;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 4px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: 12px;
  }
  form.add-member button:hover { filter: brightness(1.05); }

  footer.bottom {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    background: var(--panel);
  }
  footer.bottom p { margin: 0 0 6px; }
  footer.bottom p:last-child { margin-bottom: 0; }

  /* Recent-activity panel: a single per-endpoint summary table over the
     rolling window, styled to match the members table. */
  section.activity {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow);
    margin: 16px 0;
    padding: 16px;
  }
  section.activity header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  section.activity h2 { font-size: 15px; margin: 0; }
  section.activity .badge { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  /* table-layout: fixed pins these column widths (issue #227) so the numeric
     columns don't jump around as the endpoint paths and values change. No
     min-width: unlike table.members this table has no scroll wrapper, so a
     min-width would overflow the card with no scroll affordance. Columns
     (sum 100%): Endpoint (widest, left-aligned mono path), then the five
     numeric columns. */
  table.activity { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 13px; }
  table.activity th:nth-child(1) { width: 34%; }
  table.activity th:nth-child(2) { width: 16%; }
  table.activity th:nth-child(3) { width: 14%; }
  table.activity th:nth-child(4) { width: 12%; }
  table.activity th:nth-child(5) { width: 12%; }
  table.activity th:nth-child(6) { width: 12%; }
  table.activity th, table.activity td {
    padding: 6px 10px;
    text-align: right;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.activity th:first-child, table.activity td:first-child { text-align: left; }
  table.activity td.endpoint { font-family: var(--mono); font-size: 12px; }
  table.activity th { font-weight: 600; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  table.activity tr:last-child td { border-bottom: none; }
  table.activity td.err { color: var(--danger); }
  section.activity .note { color: var(--muted); font-size: 12px; margin: 10px 0 0; }
</style>
</head>
<body>
<header class="top">
  <h1>Agent Quota Gateway</h1>
  <span class="meta">Pool Management</span>
</header>
<main>
  <div id="banner" role="alert"></div>
  <div id="unsaved" role="alert"></div>
  <div id="envonly" role="alert"></div>
  <div id="addsub"></div>
  <div id="pools"></div>
  <div id="activity"></div>
</main>
<footer class="bottom">
  <p>Inherits the gateway&rsquo;s trust boundary. Default mode: loopback only.</p>
  <p>Shared mode: any tailnet member that can reach this port can read the pool layout and issue writes (reorder priority, disable members). The Tailscale ACL is the only gate.</p>
</footer>
<script>
(function () {
  'use strict';

  // Credential contract: ALLOWED_MEMBER_KEYS are the only member fields read
  // from /_gateway/config and rendered. A credential is write-only — the
  // add-subscription form sends it in the POST body and never reads it back,
  // stores it in the DOM, or echoes it anywhere. The static guard in
  // config_handlers_test.go enforces this: the deliberately-named credential
  // field is on a tight allowlist; any other secret/token/api-key shaped
  // string still fails the build.
  var ALLOWED_MEMBER_KEYS = ['nick', 'base_url', 'disabled', 'status'];

  var root = document.getElementById('pools');
  var banner = document.getElementById('banner');
  var unsavedBanner = document.getElementById('unsaved');
  var envonlyBanner = document.getElementById('envonly');
  var POLL_MS = 3000;

  // currentViews holds the latest sanitized config views, so the move flow can
  // enumerate candidate target pools and inspect a target's type/membership
  // without re-fetching. Set on every renderAll().
  var currentViews = [];

  function showBanner(msg) {
    banner.textContent = msg;
    banner.classList.add('show');
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(function () {
      banner.classList.remove('show');
    }, 5000);
  }

  // showUnsaved surfaces the persistent unsaved-config warning (issue #218)
  // driven by the X-AQG-Unsaved-Config response header on /_gateway/config.
  // No auto-hide: it stays until a later config load reports the header gone.
  // The header is set only when a config flush to disk has FAILED
  // (internal/configfile Unsaved), so this is a genuine data-loss risk, not a
  // transient "write pending" state.
  function showUnsaved(on) {
    if (on) {
      unsavedBanner.textContent =
        'On-disk config lags memory; a recent change may not be saved yet.';
      unsavedBanner.classList.add('show');
    } else {
      unsavedBanner.classList.remove('show');
    }
  }

  // showEnvOnly surfaces the persistent env-only banner (issue #246)
  // driven by the X-AQG-Persistence response header on /_gateway/config.
  // No auto-hide: it stays until a later config load reports a different
  // persistence mode. Distinct from showUnsaved (failed flush) and
  // showBanner (transient errors) by both copy and color, so the operator
  // can tell which durability state the banner names.
  function showEnvOnly(mode) {
    if (mode === 'env_only') {
      envonlyBanner.textContent =
        'Running in env-only mode — runtime changes are not persisted and will be lost on restart.';
      envonlyBanner.classList.add('show');
    } else {
      envonlyBanner.classList.remove('show');
    }
  }

  function escapeHTML(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function isBalanced(view) {
    return !!view.balance_mode && view.balance_mode.length > 0;
  }

  function sanitizeView(view) {
    // Defensive: drop any member field that is not on the allowlist.
    var members = (view.members || []).map(function (m) {
      var out = {};
      ALLOWED_MEMBER_KEYS.forEach(function (k) {
        if (m && Object.prototype.hasOwnProperty.call(m, k)) {
          out[k] = m[k];
        }
      });
      return out;
    });
    // window_labels is a pool-level hint (issue #138): Z.AI's long
    // window is monthly, others are 7d. Pass it through as-is when
    // present; UI consumers fall back to "5h"/"7d" when missing.
    var windowLabels = null;
    if (view.window_labels && typeof view.window_labels === 'object') {
      windowLabels = {
        short: String(view.window_labels.short || '5h'),
        long: String(view.window_labels.long || '7d'),
      };
    }
    return {
      pool: String(view.pool || ''),
      balance_mode: view.balance_mode || '',
      priority: Array.isArray(view.priority) ? view.priority.slice() : [],
      members: members,
      window_labels: windowLabels,
    };
  }

  function fetchJSON(url, opts) {
    return fetch(url, opts || {}).then(function (resp) {
      var ct = resp.headers.get('content-type') || '';
      // Only /_gateway/config sets these; harmless (false / empty) elsewhere.
      // Read here so loadConfig can surface the unsaved-config warning
      // (issue #218) and the env-only banner (issue #246).
      var unsavedConfig = resp.headers.get('X-AQG-Unsaved-Config') === 'true';
      var persistenceMode = resp.headers.get('X-AQG-Persistence') || '';
      var p = resp.text().then(function (text) {
        var body = text;
        if (ct.indexOf('application/json') !== -1) {
          try { body = JSON.parse(text); } catch (e) { body = null; }
        }
        return { status: resp.status, ok: resp.ok, body: body, unsavedConfig: unsavedConfig, persistenceMode: persistenceMode };
      });
      return p;
    });
  }

  function renderEmpty(msg) {
    root.innerHTML = '';
    var d = document.createElement('div');
    d.className = 'empty';
    d.textContent = msg;
    root.appendChild(d);
  }

  function renderSection(view) {
    var section = document.createElement('section');
    section.className = 'pool';
    section.setAttribute('data-pool', view.pool);

    var head = document.createElement('header');
    var h2 = document.createElement('h2');
    h2.textContent = view.pool;
    head.appendChild(h2);

    if (isBalanced(view)) {
      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = 'balanced — priority N/A';
      head.appendChild(badge);
    } else if (view.priority.length > 0) {
      var badge2 = document.createElement('span');
      badge2.className = 'badge';
      badge2.textContent = 'priority pool';
      head.appendChild(badge2);
    }

    var updated = document.createElement('span');
    updated.className = 'updated';
    updated.setAttribute('data-role', 'updated');
    updated.textContent = '';
    head.appendChild(updated);

    // Delete-pool control, offered only for an empty pool (issue #233). The
    // DELETE API is empty-only — it returns 409 for a pool that still has
    // members (issue #232) — so the button never appears while any row remains.
    // Rename-pool control is offered for every pool (issue #238); it lives
    // next to delete when both apply (empty pool) and alone otherwise.
    var rename = document.createElement('button');
    rename.type = 'button';
    rename.className = 'rename-pool';
    rename.setAttribute('data-role', 'rename-pool');
    rename.textContent = 'Rename pool';
    rename.addEventListener('click', function () {
      renamePool(view.pool);
    });
    head.appendChild(rename);
    if ((view.members || []).length === 0) {
      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'delete-pool';
      del.setAttribute('data-role', 'delete-pool');
      del.textContent = 'Delete pool';
      del.addEventListener('click', function () {
        deletePool(view.pool);
      });
      head.appendChild(del);
    }

    section.appendChild(head);

    // One card body: the "Members" table, ordered by priority, with the rank +
    // ↑/↓ reorder controls folded into each row's leading Nick cell (issue
    // #222). Collapsing the former two-column (priority | members) grid makes
    // order consistency and row alignment structural instead of CSS-dependent.
    var body = document.createElement('div');
    body.className = 'col';
    var h3m = document.createElement('h3');
    h3m.textContent = 'Members';
    body.appendChild(h3m);

    if (isBalanced(view)) {
      var note = document.createElement('p');
      note.className = 'balanced-note';
      note.textContent = 'Balanced pools rotate automatically; manual priority is not applicable.';
      body.appendChild(note);
    }

    body.appendChild(renderMembers(view));
    section.appendChild(body);
    return section;
  }

  // orderedMembers returns view.members as objects in effective priority order.
  // For a priority pool that is view.priority; for a plain pool with no priority
  // yet it seeds from the members' own order, so the first reorder POSTs that
  // order and the pool becomes a priority pool. Balanced pools have no manual
  // order — members' own order is kept. Any member missing from the priority
  // list (members ranked after the listed ones, in the members' sorted order,
  // per README) is appended so no row is dropped.
  function orderedMembers(view) {
    var members = view.members || [];
    if (isBalanced(view) || view.priority.length === 0) return members.slice();
    var byNick = {};
    members.forEach(function (m) { byNick[m.nick] = m; });
    var result = [];
    view.priority.forEach(function (nick) {
      if (byNick[nick]) { result.push(byNick[nick]); delete byNick[nick]; }
    });
    members.forEach(function (m) { if (byNick[m.nick]) result.push(m); });
    return result;
  }

  function renderMembers(view) {
    var table = document.createElement('table');
    table.className = 'members';

    // Provider-agnostic column headers (issue #154): the long-window
    // header used to be inferred from the active member's base URL via
    // view.window_labels.long (issue #138), so it flipped across failover
    // (z.ai monthly <-> Anthropic 7d) and had no single correct value for
    // a mixed pool — while the cell data always lives in unified_7d_*
    // regardless. A pool name carries no window semantics, so the header
    // is now a fixed string. The provider switch still drives lead-routing
    // math (poller.LongWindowFor, issue #140); only this UI label dropped
    // its dependency on it. CSS text-transform:uppercase renders these.
    var thead = document.createElement('thead');
    var trh = document.createElement('tr');
    ['Nick', 'Status', '5H', '5H reset', '7/30D', '7/30D reset', ''].forEach(function (h) {
      var th = document.createElement('th');
      th.textContent = h;
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);

    // Rows render in priority order (issue #222). Show the rank number + ↑/↓
    // reorder controls only when there is something to reorder: a non-balanced
    // pool with >=2 members. Balanced pools rotate automatically, and a lone
    // member has no order — both get a plain nick cell.
    var ordered = orderedMembers(view);
    var showReorder = !isBalanced(view) && ordered.length >= 2;

    var tbody = document.createElement('tbody');
    ordered.forEach(function (m, idx) {
      var tr = document.createElement('tr');
      tr.setAttribute('data-nick', m.nick);

        rank.className = 'rank';
        rank.textContent = String(idx + 1);
        wrap.appendChild(rank);

        var name = document.createElement('span');
        name.className = 'nick-name';
        name.textContent = m.nick;
        wrap.appendChild(name);

        var up = document.createElement('button');
        up.type = 'button';
        up.className = 'prio-btn';
        up.textContent = '↑';
        up.setAttribute('aria-label', 'Move ' + m.nick + ' up');
        up.disabled = idx === 0;
        up.addEventListener('click', function () {
          movePriority(view.pool, idx, idx - 1);
        });
        wrap.appendChild(up);

        var down = document.createElement('button');
        down.type = 'button';
        down.className = 'prio-btn';
        down.textContent = '↓';
        down.setAttribute('aria-label', 'Move ' + m.nick + ' down');
        down.disabled = idx === ordered.length - 1;

      } else {

      tr.appendChild(tdN);

      status.setAttribute('data-role', 'status');
      status.textContent = m.status || 'idle';
      tdS.appendChild(status);
      tr.appendChild(tdS);

      // Quota cells start as "-"; applyLiveStatus() fills them from
      // /_gateway/pool once a snapshot exists (config carries no snapshot).
      var td5h = document.createElement('td');
      td5h.className = 'quota';
      td5h.setAttribute('data-role', 'quota-5h');
      renderQuota(td5h, null);
      tr.appendChild(td5h);

      var td5hr = document.createElement('td');
      td5hr.className = 'reset';
      td5hr.setAttribute('data-role', 'reset-5h');
      td5hr.textContent = '-';
      tr.appendChild(td5hr);

      // The 5h / 5h-reset cells stay hard-coded; the long-window cells
      // keep the snapshot's unified_7d_* fields (right data shape) but
      // surface as "monthly" or whatever the pool's label says.
      var tdLong = document.createElement('td');
      tdLong.className = 'quota';
      tdLong.setAttribute('data-role', 'quota-long');
      renderQuota(tdLong, null);
      tr.appendChild(tdLong);

      var tdLongReset = document.createElement('td');
      tdLongReset.className = 'reset';
      tdLongReset.setAttribute('data-role', 'reset-long');

      tr.appendChild(tdLongReset);

      var tdA = document.createElement('td');
      var actions = document.createElement('div');
      actions.className = 'row-actions';

      var btn = document.createElement('button');
      btn.type = 'button';

      btn.setAttribute('data-role', 'toggle');
      btn.setAttribute('data-state', m.disabled ? 'disabled' : 'enabled');
      btn.setAttribute('role', 'switch');
      btn.setAttribute('aria-checked', m.disabled ? 'false' : 'true');
      btn.setAttribute('aria-label', m.disabled ? 'Enable member' : 'Disable member');
      var track = document.createElement('span');
      track.className = 'toggle-track';
      track.setAttribute('aria-hidden', 'true');
      var thumb = document.createElement('span');
      thumb.className = 'toggle-thumb';
      thumb.setAttribute('aria-hidden', 'true');
      track.appendChild(thumb);
      btn.appendChild(track);
      var labelEl = document.createElement('span');
      labelEl.className = 'toggle-label';
      labelEl.textContent = m.disabled ? 'Off' : 'On';
      btn.appendChild(labelEl);
      btn.addEventListener('click', function () {
        // Read the current state from the live data-state (applyLiveStatus keeps
        // it in sync with /_gateway/pool), not the render-time m.disabled closure.
        // Once an out-of-band disable has diverged badge from toggle, the captured
        // value is stale and would issue the wrong verb (issue #159).
        var enabled = btn.getAttribute('data-state') === 'enabled';
        toggleMember(view.pool, m.nick, enabled);
      });
      actions.appendChild(btn);

      // "Clear park" — per-nick live-429 park override (issue #147). Created
      // hidden; applyLiveStatus() reveals it only when /_gateway/pool reports
      // this member parked:true (config carries no live park state).
      var clr = document.createElement('button');
      clr.type = 'button';
      clr.className = 'clear-park';
      clr.setAttribute('data-role', 'clear-park');
      clr.textContent = 'Clear park';
      clr.style.display = 'none';
      clr.addEventListener('click', function () {
        clearPark(view.pool, m.nick);
      });
      actions.appendChild(clr);

      var mv = document.createElement('button');
      mv.type = 'button';
      mv.className = 'move';
      mv.setAttribute('data-role', 'move');
      mv.textContent = 'Move';
      mv.addEventListener('click', function () {
        moveMember(view.pool, m.nick);
      });
      actions.appendChild(mv);

      var rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'remove';
      rm.setAttribute('data-role', 'remove');
      rm.textContent = 'Remove';
      rm.addEventListener('click', function () {
        removeMember(view.pool, m.nick);
      });
      actions.appendChild(rm);

      tdA.appendChild(actions);
      tr.appendChild(tdA);

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    // Wrap in a horizontally-scrollable container so the wide table degrades
    // to scroll (not clipping) when its grid cell is narrower than its
    // min-content width (narrow desktop / mobile). See .members-scroll.
    var scroll = document.createElement('div');
    scroll.className = 'members-scroll';
    scroll.appendChild(table);
    return scroll;
  }

  // renderQuota paints one rolling-window cell. utilization is a 0..1
  // fraction (null/undefined when the window has no data). Missing data
  // renders a muted "-"; present data renders a clamped progress bar with
  // a NN% label. Reset times live in their own columns (see formatReset).
  function renderQuota(cell, utilization) {
    cell.textContent = '';
    if (utilization == null || typeof utilization !== 'number' || isNaN(utilization)) {
      var dash = document.createElement('span');
      dash.className = 'quota-dash';
      dash.textContent = '-';
      cell.appendChild(dash);
      return;
    }
    var pct = Math.max(0, Math.min(100, utilization * 100));
    var label = Math.round(pct) + '%';

    var wrap = document.createElement('div');
    wrap.className = 'quota-bar';

    var track = document.createElement('div');
    track.className = 'quota-track';
    var fill = document.createElement('div');
    fill.className = 'quota-fill';
    fill.style.width = pct + '%';
    track.appendChild(fill);
    wrap.appendChild(track);

    var pctLabel = document.createElement('span');
    pctLabel.className = 'quota-pct';
    pctLabel.textContent = label;
    wrap.appendChild(pctLabel);

    cell.appendChild(wrap);
  }

  // formatReset renders an RFC3339 reset timestamp as a future-relative
  // duration against the client clock. kind selects the per-window format
  // (see issue #99). Returns "-" for missing, unparseable, or non-positive
  // (already-elapsed) values; the next poll refreshes it naturally. Compact
  // units (h/m, no "in" prefix) keep the reset columns narrow so the wide
  // 7-col table overflows later on phones (issue #171).
  function formatReset(iso, kind) {
    if (!iso) return '-';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '-';
    var ms = d.getTime() - Date.now();
    if (ms <= 0) return '-';
    var totalMin = Math.floor(ms / 60000);
    if (kind === '5h') {
      var h5 = Math.floor(totalMin / 60);
      var m5 = totalMin % 60;
      return h5 > 0 ? h5 + 'h ' + m5 + 'm' : m5 + 'm';
    }
    // 7d window.
    var days = Math.floor(totalMin / 1440);
    var hrs = Math.floor((totalMin % 1440) / 60);
    var mins = totalMin % 60;
    return days > 0
      ? days + 'd ' + hrs + 'h ' + mins + 'm'
      : hrs + 'h ' + mins + 'm';
  }

  // resetLive is the freshness guard the routing layer (windowBlocks,
  // internal/auto/auto.go:2647) and formatReset already apply: a window's
  // snapshot is current only while its reset is still in the future. Once
  // the reset has elapsed the frozen utilization is stale — recovery to
  // idle happens by wall-clock and the quota store is not rewritten until
  // the next real response (#134/#176). Returns false for missing /
  // unparseable / elapsed ISO, so a renderQuota cell paired with the
  // matching formatReset cell gets the same gate (both columns read '-').
  function resetLive(iso) {
    if (!iso) return false;
    var d = new Date(iso);
    if (isNaN(d.getTime())) return false;
    return d.getTime() - Date.now() > 0;
  }

  // formatResetAbsolute returns the local yyyy-mm-dd hh:mm:ss for a reset ISO
  // string, surfaced via the reset cell's native title tooltip so the absolute
  // time is reachable even though the cell shows only a relative countdown
  // (issue #171). Returns '' under the same gate as formatReset (missing /
  // unparseable / already-elapsed) so '-' cells render no tooltip.
  function formatResetAbsolute(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    if (d.getTime() - Date.now() <= 0) return '';
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  }

  function mkInput(type, field, placeholder) {
    var el = document.createElement('input');
    el.type = type;
    el.setAttribute('data-field', field);
    el.placeholder = placeholder;
    el.autocomplete = 'off';
    return el;
  }

  // NEW_POOL is the sentinel pool-selector value that switches the form into
  // create-a-runtime-pool mode (wires POST /_gateway/pool, issue #148).
  var NEW_POOL = '__new__';

  // renderAddSubscription builds the single standalone Add-subscription form
  // (outside the pool boxes) into #addsub, rebuilt on each renderAll so the
  // target-pool dropdown stays in sync. It targets any existing pool, and its
  // "New pool…" selector option creates a runtime pool via POST /_gateway/pool
  // (#104/#148) and can add the first member in the same submit. It renders
  // even with zero pools so the first pool can be created from a fresh gateway.
  function renderAddSubscription(views) {
    var host = document.getElementById('addsub');
    if (!host) { return; }
    host.innerHTML = '';
    views = views || [];

    var section = document.createElement('section');
    section.className = 'addsub-card';

    var h2 = document.createElement('h2');
    h2.textContent = 'Add subscription';
    section.appendChild(h2);

    var hint = document.createElement('p');
    hint.className = 'addsub-hint';
    hint.textContent = 'Choose a target pool, or pick "New pool…" to create a ' +
      'runtime plain pool (name required) — a nick is optional there and, ' +
      'if given, is added as the pool’s first member (base_url is required ' +
      'for a genuinely new nick).';
    section.appendChild(hint);

    var form = document.createElement('form');
    form.className = 'add-member';
    form.setAttribute('data-role', 'add-member');

    var nick = mkInput('text', 'nick', 'nick');
    var base = mkInput('text', 'base_url', 'base_url (optional)');
    var cred = mkInput('password', 'credential', 'credential (optional)');

    // New-pool field, revealed only when NEW_POOL is selected.
    var poolName = mkInput('text', 'pool_name', 'new pool name');

    var pool = document.createElement('select');
    pool.setAttribute('data-field', 'pool');
    views.forEach(function (v) {
      var opt = document.createElement('option');
      opt.value = v.pool;
      opt.textContent = v.pool;
      pool.appendChild(opt);
    });
    var newOpt = document.createElement('option');
    newOpt.value = NEW_POOL;
    newOpt.textContent = 'New pool…';
    pool.appendChild(newOpt);

    form.appendChild(nick);
    form.appendChild(base);
    form.appendChild(cred);
    form.appendChild(pool);
    form.appendChild(poolName);

    // toggleNewPool reveals/hides the new-pool field and adjusts the nick
    // placeholder (nick is optional when creating a pool). Called on build and
    // on every selector change so the zero-pool case starts already revealed.
    function toggleNewPool() {
      var creating = pool.value === NEW_POOL;
      poolName.style.display = creating ? '' : 'none';
      nick.placeholder = creating ? 'nick (optional)' : 'nick';
    }
    pool.addEventListener('change', toggleNewPool);
    toggleNewPool();

    var submit = document.createElement('button');
    submit.type = 'submit';
    submit.textContent = 'Add subscription';
    form.appendChild(submit);

    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      addSubscription({
        nick: nick, base: base, cred: cred, pool: pool,
        poolName: poolName,
      });
    });

    section.appendChild(form);
    host.appendChild(section);
  }

  function loadConfig() {
    return fetchJSON('/_gateway/config').then(function (r) {
      if (!r.ok || !Array.isArray(r.body)) {
        showBanner('Failed to load /_gateway/config (status ' + r.status + ')');
        // Leave the unsaved warning as-is: a failed fetch is not evidence the
        // on-disk flush succeeded, so don't clear a standing warning here.
        return [];
      }
      showUnsaved(r.unsavedConfig);
      showEnvOnly(r.persistenceMode);
      return r.body.map(sanitizeView);
    });
  }

  function loadStatus() {
    return fetchJSON('/_gateway/pool').then(function (r) {
      if (!r.ok || !Array.isArray(r.body)) return null;
      return r.body;
    });
  }

  function applyLiveStatus(statuses) {
    if (!statuses) return;
    var byPool = {};
    statuses.forEach(function (s) { byPool[s.pool] = s; });
    var sections = root.querySelectorAll('section.pool');
    var now = new Date();
    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(now.getMinutes()).padStart(2, '0');
    var ss = String(now.getSeconds()).padStart(2, '0');
    var stamp = 'updated ' + hh + ':' + mm + ':' + ss;

    sections.forEach(function (section) {
      var pool = section.getAttribute('data-pool');
      var s = byPool[pool];
      var upd = section.querySelector('[data-role="updated"]');
      if (upd) upd.textContent = stamp;
      if (!s) return;
      var rows = section.querySelectorAll('table.members tbody tr');
      rows.forEach(function (tr) {
        var nick = tr.getAttribute('data-nick');
        var match = null;
        s.members.forEach(function (m) { if (m.nick === nick) match = m; });
        if (!match) return;
        var badge = tr.querySelector('[data-role="status"]');
        if (badge) {
          badge.setAttribute('data-status', match.status || 'idle');
          badge.textContent = match.status || 'idle';
        }
        // Sync the toggle from the live disabled flag so it can't freeze "On"
        // while the badge reads "disabled" after an out-of-band disable (issue
        // #159). Mirrors the render-time logic at the toggle's creation.
        var toggle = tr.querySelector('[data-role="toggle"]');
        if (toggle) {
          var disabled = !!match.disabled;
          toggle.setAttribute('data-state', disabled ? 'disabled' : 'enabled');
          toggle.setAttribute('aria-checked', disabled ? 'false' : 'true');
          toggle.setAttribute('aria-label', disabled ? 'Enable member' : 'Disable member');
          var tl = toggle.querySelector('.toggle-label');
          if (tl) tl.textContent = disabled ? 'Off' : 'On';
        }
        // The per-nick "Clear park" control surfaces only on a live-parked
        // member (issue #147). parked is the reliable live-429 gate from
        // /_gateway/pool, independent of the status string.
        var clr = tr.querySelector('[data-role="clear-park"]');
        if (clr) {
          clr.style.display = match.parked ? '' : 'none';
        }
        var snap = match.snapshot || null;
        // Pull each window's reset ISO once so the quota cell and its
        // adjacent reset cell share one parse and apply the same freshness
        // gate (resetLive, issue #176). When the reset has elapsed the
        // snapshot is stale — renderQuota gets null so the cell reads '-'
        // instead of the frozen at-cap value the quota store still holds.
        var iso5h = snap ? snap.unified_5h_reset : null;
        var isoLong = snap ? snap.unified_7d_reset : null;
        var cell5h = tr.querySelector('[data-role="quota-5h"]');
        if (cell5h) {
          renderQuota(cell5h, (snap && resetLive(iso5h)) ? snap.unified_5h_utilization : null);
        }
        var reset5h = tr.querySelector('[data-role="reset-5h"]');
        if (reset5h) {
          reset5h.textContent = formatReset(iso5h, '5h');
          // Absolute local time via native title; '' when there is no live
          // reset, so a dropped snapshot clears any stale tooltip.
          reset5h.title = formatResetAbsolute(iso5h);
        }
        var cellLong = tr.querySelector('[data-role="quota-long"]');
        if (cellLong) {
          renderQuota(cellLong, (snap && resetLive(isoLong)) ? snap.unified_7d_utilization : null);
        }
        var resetLong = tr.querySelector('[data-role="reset-long"]');
        if (resetLong) {
          // The snapshot still uses unified_7d_* (right data shape for
          // any long window); only the human label is monthly for Z.AI.
          // formatReset('7d') returns the Xd/Yhr/Zmin branch, which is
          // what a monthly reset needs.
          resetLong.textContent = formatReset(isoLong, '7d');
          resetLong.title = formatResetAbsolute(isoLong);
        }
      });
    });
  }

  function renderAll(views) {
    currentViews = views || [];
    renderAddSubscription(currentViews);
    if (!views.length) {
      renderEmpty('No pools configured.');
      return;
    }
    root.innerHTML = '';
    views.forEach(function (v) {
      root.appendChild(renderSection(v));
    });
  }

  function movePriority(pool, from, to) {
    var section = root.querySelector('section.pool[data-pool="' + cssEscape(pool) + '"]');
    if (!section) return;
    var items = section.querySelectorAll('table.members tbody tr');
    var order = [];
    items.forEach(function (tr) { order.push(tr.getAttribute('data-nick')); });
    if (from < 0 || to < 0 || from >= order.length || to >= order.length) return;
    var nick = order.splice(from, 1)[0];
    order.splice(to, 0, nick);
    postJSON('/_gateway/pool/' + encodeURIComponent(pool) + '/priority', order)
      .then(function (r) { return refreshAfter(r, 'Failed to reorder priority'); });
  }

  function toggleMember(pool, nick, disabled) {
    var verb = disabled ? 'disable' : 'enable';
    postJSON('/_gateway/pool/' + encodeURIComponent(pool) + '/member/' + encodeURIComponent(nick) + '/' + verb, null)
      .then(function (r) { return refreshAfter(r, 'Failed to ' + verb + ' member'); });
  }

  function clearPark(pool, nick) {
    // This overrides the gateway's own judgment that the member is parked, so
    // confirm. Real quota exhaustion re-parks via record429 on the next 429.
    var ok = window.confirm(
      'Clear the live-429 park on "' + nick + '" in pool "' + pool + '"?\n\n' +
      'This forces the member back into rotation now, overriding the gateway. ' +
      'If it is genuinely out of quota it will simply re-park on the next 429.');
    if (!ok) { return; }
    postJSON('/_gateway/clear?pool=' + encodeURIComponent(pool) + '&nick=' + encodeURIComponent(nick), null)
      .then(function (r) { return refreshAfter(r, 'Failed to clear park'); });
  }

  function addSubscription(fields) {
    var nick = (fields.nick.value || '').trim();
    var cred = fields.cred.value || '';
    var base = (fields.base.value || '').trim();
    var pool = fields.pool.value || '';

    // Create the pool and optional first member in one atomic request.
    if (pool === NEW_POOL) {
      var pName = (fields.poolName.value || '').trim();
      if (!pName) { showBanner('Create pool failed: pool name is required'); return; }
      var body = { name: pName };
      if (nick) { body.nick = nick; if (cred) { body['credential'] = cred; } if (base) { body.base_url = base; } }
      postJSON('/_gateway/pool', body).then(function (r) {
        if (r && r.ok) { fields.poolName.value = ''; fields.nick.value = ''; fields.base.value = ''; fields.cred.value = ''; }
        return refreshAfter(r, 'Failed to create pool');
      });
      return;
    }

    // nick and a target pool are always required. The other two fields are
    // optional — the backend resolves them for a known subscription and returns
    // a clear 400 when it cannot.
    if (!nick) { showBanner('Add failed: nick is required'); return; }
    if (!pool) { showBanner('Add failed: target pool is required'); return; }

    var target = null;
    currentViews.forEach(function (v) { if (v.pool === pool) target = v; });
    if (!target) { showBanner('Add failed: unknown target pool "' + pool + '"'); return; }

    var body = {};
    if (cred) { body['credential'] = cred; }
    if (base) { body.base_url = base; }

    // A priority target needs an explicit placement that includes this nick;
    // there is no implicit insertion. Plain/balanced targets carry none.
    var isPriorityTarget = !isBalanced(target) && target.priority.length > 0;
    if (isPriorityTarget) {
      var suggestion = target.priority.slice().concat([nick]).join(', ');
      var placementStr = window.prompt(
        'Pool "' + pool + '" is a priority pool. Enter the full priority order ' +
        '(comma-separated, highest first). It must include "' + nick + '":',
        suggestion);
      if (placementStr == null) { return; }
      var placement = placementStr.split(',')
        .map(function (s) { return s.trim(); })
        .filter(function (s) { return s.length > 0; });
      if (placement.indexOf(nick) === -1) {
        showBanner('Add failed: placement must include "' + nick + '"');
        return;
      }
      body.placement = placement;
    }

    postJSON('/_gateway/pool/' + encodeURIComponent(pool) + '/member/' + encodeURIComponent(nick), body)
      .then(function (r) {
        // Clear inputs on success so the value never lingers in the DOM.
        if (r && r.ok) {
          fields.nick.value = '';
          fields.base.value = '';
          fields.cred.value = '';
        }
        return refreshAfter(r, 'Failed to add subscription');
      });
  }

  function removeMember(pool, nick) {
    var ok = window.confirm(
      'Remove subscription "' + nick + '" from pool "' + pool + '"?\n\n' +
      'This is permanent and cannot be undone.');
    if (!ok) { return; }
    fetchJSON('/_gateway/pool/' + encodeURIComponent(pool) + '/member/' + encodeURIComponent(nick),
      { method: 'DELETE', headers: { 'Accept': 'application/json' } })
      .then(function (r) { return refreshAfter(r, 'Failed to remove subscription'); });
  }

  function deletePool(pool) {
    var ok = window.confirm(
      'Delete empty pool "' + pool + '"?\n\n' +
      'This is permanent and cannot be undone.');
    if (!ok) { return; }
    // The pool may have gained a member between render and click; the API then
    // returns 409 and refreshAfter surfaces that server error rather than
    // failing silently (issue #233).
    fetchJSON('/_gateway/pool/' + encodeURIComponent(pool),
      { method: 'DELETE', headers: { 'Accept': 'application/json' } })
      .then(function (r) { return refreshAfter(r, 'Failed to delete pool'); });
  }

  function renamePool(pool) {
    var newName = window.prompt(
      'Rename pool "' + pool + '" to:\n\n' +
      '(Pool names are normalized the same way env vars are: lowercase, underscores become hyphens.)',
      pool);
    if (newName == null) { return; }
    newName = newName.trim();
    if (!newName) {
      showBanner('Rename failed: new name is required');
      return;
    }
    // refreshAfter surfaces 400 (empty / identical-after-normalize) / 404
    // (unknown pool) / 409 (collides with another pool) via the error banner,
    // matching the pattern other mutation controls use.
    fetchJSON('/_gateway/pool/' + encodeURIComponent(pool) + '/rename',
      { method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ name: newName }) })
      .then(function (r) { return refreshAfter(r, 'Failed to rename pool'); });
  }

  function moveMember(fromPool, nick) {
    var targets = currentViews
      .map(function (v) { return v.pool; })
      .filter(function (p) { return p !== fromPool; });
    if (!targets.length) {
      showBanner('Move failed: no other pool to move into');
      return;
    }
    var to = window.prompt(
      'Move subscription "' + nick + '" from "' + fromPool + '" to which pool?\n\n' +
      'Available: ' + targets.join(', '), targets[0]);
    if (to == null) { return; }
    to = to.trim();
    if (!to) { return; }

    var target = null;
    currentViews.forEach(function (v) { if (v.pool === to) target = v; });
    if (!target) {
      showBanner('Move failed: unknown target pool "' + to + '"');
      return;
    }

    var body = { to: to };

    // A priority target with no existing slot for this nick needs explicit
    // placement; there is no implicit insertion. Plain/balanced targets, and
    // overwriting an existing same-nick slot, need none.
    var isPriorityTarget = !isBalanced(target) && target.priority.length > 0;
    var existingSlot = false;
    target.members.forEach(function (m) { if (m.nick === nick) existingSlot = true; });
    if (isPriorityTarget && !existingSlot) {
      var suggestion = target.priority.slice().concat([nick]).join(', ');
      var placementStr = window.prompt(
        'Target "' + to + '" is a priority pool. Enter the full priority order ' +
        '(comma-separated, highest first). It must include "' + nick + '":',
        suggestion);
      if (placementStr == null) { return; }
      var placement = placementStr.split(',')
        .map(function (s) { return s.trim(); })
        .filter(function (s) { return s.length > 0; });
      if (placement.indexOf(nick) === -1) {
        showBanner('Move failed: placement must include "' + nick + '"');
        return;
      }
      body.placement = placement;
    }

    postMove(fromPool, nick, body, false);
  }

  function postMove(fromPool, nick, body, isRetry) {
    var url = '/_gateway/pool/' + encodeURIComponent(fromPool) +
      '/member/' + encodeURIComponent(nick) + '/move';
    return postJSON(url, body).then(function (r) {
      if (r && r.status === 409 && !isRetry) {
        var ok = window.confirm(
          'Target already has "' + nick + '" configured differently (key or base_url).\n\n' +
          'Overwrite the target member?');
        if (!ok) { return loadConfig().then(renderAll); }
        var forced = {};
        Object.keys(body).forEach(function (k) { forced[k] = body[k]; });
        forced.force = true;
        return postMove(fromPool, nick, forced, true);
      }
      return refreshAfter(r, 'Failed to move subscription');
    });
  }

  function postJSON(url, body) {
    var opts = { method: 'POST', headers: { 'Accept': 'application/json' } };
    if (body !== null && body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    return fetchJSON(url, opts);
  }

  function refreshAfter(resp, msg) {
    if (resp && resp.ok) {
      return loadConfig().then(renderAll).then(loadStatus).then(applyLiveStatus);
    }
    var err = (resp && resp.body && resp.body.error) || (resp ? ('status ' + resp.status) : 'network error');
    showBanner(msg + ': ' + err);
    // Re-fetch to reconcile UI with server state after a failed write.
    return loadConfig().then(renderAll);
  }

  function cssEscape(s) {
    if (window.CSS && window.CSS.escape) return window.CSS.escape(s);
    return String(s).replace(/[^a-zA-Z0-9_-]/g, function (c) { return '\\' + c; });
  }

  // ---- Recent activity panel (issue #217) --------------------------------
  // /_gateway/activity returns a per-endpoint series of up to 60 one-minute
  // buckets. The panel collapses each endpoint's series into one summary row:
  // window totals for volume/errors, and latency read from the most recent
  // bucket (percentiles can't be honestly re-derived across buckets, so the
  // window max is the only cross-bucket latency stat shown).
  var activityRoot = document.getElementById('activity');

  function loadActivity() {
    return fetchJSON('/_gateway/activity').then(function (r) {
      if (!r.ok || !r.body || typeof r.body !== 'object') {
        renderActivity(null);
        return;
      }
      renderActivity(r.body);
    }).catch(function () { renderActivity(null); });
  }

  function summarizeSeries(points) {
    var volume = 0, errors = 0, maxMs = 0, latest = null;
    for (var i = 0; i < points.length; i++) {
      var p = points[i];
      volume += p.volume || 0;
      errors += p.errors || 0;
      var m = (p.latency && p.latency.maxMs) || 0;
      if (m > maxMs) maxMs = m;
      if (!latest || p.bucketStart > latest.bucketStart) latest = p;
    }
    var lat = (latest && latest.latency) || { p50Ms: 0, p95Ms: 0, maxMs: 0 };
    return {
      volume: volume,
      errors: errors,
      errorRate: volume > 0 ? errors / volume : 0,
      p50Ms: lat.p50Ms || 0,
      p95Ms: lat.p95Ms || 0,
      maxMs: maxMs
    };
  }

  function fmtMs(ms) {
    if (!ms) return '0';
    if (ms >= 1000) return (ms / 1000).toFixed(2) + ' s';
    return Math.round(ms) + ' ms';
  }

  function fmtPct(rate) { return (rate * 100).toFixed(1) + '%'; }

  function renderActivity(series) {
    activityRoot.innerHTML = '';
    var section = document.createElement('section');
    section.className = 'activity';

    var head = document.createElement('header');
    var h2 = document.createElement('h2');
    h2.textContent = 'Recent activity (60 min)';
    head.appendChild(h2);
    var badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = 'in-memory · resets on restart';
    head.appendChild(badge);
    section.appendChild(head);

    var paths = series ? Object.keys(series).sort() : [];
    if (paths.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'No traffic recorded yet.';
      section.appendChild(empty);
      activityRoot.appendChild(section);
      return;
    }

    var table = document.createElement('table');
    table.className = 'activity';
    var thead = document.createElement('thead');
    var htr = document.createElement('tr');
    ['Endpoint', 'Requests (60m)', 'Error rate', 'p50', 'p95', 'Max'].forEach(function (label) {
      var th = document.createElement('th');
      th.textContent = label;
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    paths.forEach(function (path) {
      var s = summarizeSeries(series[path] || []);
      var tr = document.createElement('tr');

      var tdPath = document.createElement('td');
      tdPath.className = 'endpoint';
      tdPath.textContent = path;
      tr.appendChild(tdPath);

      appendCell(tr, String(s.volume));

      var tdErr = appendCell(tr, fmtPct(s.errorRate));
      if (s.errors > 0) tdErr.className = 'err';

      appendCell(tr, fmtMs(s.p50Ms));
      appendCell(tr, fmtMs(s.p95Ms));
      appendCell(tr, fmtMs(s.maxMs));

      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    section.appendChild(table);

    var note = document.createElement('p');
    note.className = 'note';
    // Latency for streaming /v1/messages is full end-to-end wall time (the
    // whole SSE response), not time-to-first-byte. p50/p95 are the latest
    // one-minute bucket; Max is over the whole 60-minute window.
    note.textContent = 'Streaming latency is full end-to-end (SSE) wall time, not time-to-first-byte. ' +
      'p50/p95 reflect the latest minute; Max spans the full window.';
    section.appendChild(note);

    activityRoot.appendChild(section);
  }

  function appendCell(tr, text) {
    var td = document.createElement('td');
    td.textContent = text;
    tr.appendChild(td);
    return td;
  }
  // ------------------------------------------------------------------------

  function tick() {
    Promise.all([
      loadStatus().then(applyLiveStatus),
      loadActivity()
    ]).then(function () {
      setTimeout(tick, POLL_MS);
    }).catch(function (e) {
      console.error('status poll failed', e);
      setTimeout(tick, POLL_MS);
    });
  }

  function boot() {
    loadConfig()
      .then(renderAll)
      .then(loadStatus)
      .then(applyLiveStatus)
      .then(loadActivity)
      .then(tick)
      .catch(function (e) {
        console.error('boot failed', e);
        renderEmpty('Failed to reach the gateway. ' + (e && e.message ? e.message : ''));
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
